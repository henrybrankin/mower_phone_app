# Initial build-only configuration for the second-stage boot manager.
CONFIG_BOOT_SWAP_USING_SCRATCH=y
CONFIG_BOOT_MAX_IMG_SECTORS=110
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n

# Keep this first footprint test minimal. Image signing and BLE transport are
# added only after the stage-two placement and slot layout are validated.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
